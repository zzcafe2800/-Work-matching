<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>宵影村『四つの名前』</title>
<style>
:root{--ink:#0d0f16;--ink2:#151824;--ink3:#1e2233;--washi:#e9e4d6;--sub:#9aa0b4;--shu:#c9463c;--ao:#5a8fb0;--line:#2b3044;--ok:#3f7d63;--warn:#c98a3c;--paperink:#2a2620;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#000;color:var(--washi);font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
button{font-family:inherit;cursor:pointer}
h1,h2,h3{font-weight:600;margin:0 0 .4em}
/* 16:9 ゲーム画面 */
#app{position:relative;width:min(100vw,calc(100vh*16/9));height:min(100vh,calc(100vw*9/16));
  aspect-ratio:16/9;overflow:hidden;background:#0a0c12;font-size:clamp(11px,1.55vh,20px);
  box-shadow:0 0 70px rgba(0,0,0,.85)}
/* 背景（全面） */
.bg{position:absolute;inset:0}
.bg .stage-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bg .stage-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:.4em;color:#5b6079;text-align:center;padding:2em;
  background:radial-gradient(130% 100% at 50% 22%,#1a2230,#0b0e15 76%);border:1px dashed #333a52}
.bg .stage-ph .fn{font-family:monospace;font-size:.72em;color:#565c78}
.bg .stage-ph .cap{font-size:.92em;letter-spacing:.03em}
.scrim{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(0deg,rgba(6,7,12,.94),rgba(6,7,12,.12) 44%,transparent 72%)}
/* HUD */
.hud{position:absolute;top:0;left:0;right:0;z-index:8;display:flex;justify-content:space-between;align-items:center;
  padding:.7em 1em;font-size:.82em;color:var(--sub);background:linear-gradient(rgba(6,7,12,.55),transparent);pointer-events:none}
.hud .you{color:var(--shu)}
.hbtn{pointer-events:auto;background:rgba(20,24,36,.72);border:1px solid var(--line);color:var(--washi);
  border-radius:999px;padding:.32em .95em;font-size:.92em}
/* セリフ窓（VN） */
.vn{position:absolute;left:3%;right:3%;bottom:3.4%;z-index:7;display:flex;gap:.7em;align-items:flex-end}
.vn-portrait{flex:0 0 4.3em;width:4.3em;height:4.3em;border-radius:.5em;overflow:hidden;border:1px solid var(--shu);background:#0d0f16}
.vn-portrait .ph{margin:0}.vn-portrait .box{min-height:4.3em;border:none;padding:.2em}
.vn-portrait .fn{display:none}.vn-portrait .cap{font-size:.5em;line-height:1.2}
.vn-portrait img{width:100%;height:100%;object-fit:cover}
.vn-box{flex:1;background:rgba(9,11,18,.86);border:1px solid var(--shu);border-radius:.5em;padding:.6em 1em;backdrop-filter:blur(2px);box-shadow:0 6px 24px rgba(0,0,0,.5)}
.vn-name{color:var(--shu);font-size:.82em;margin-bottom:.15em;letter-spacing:.08em}
.vn-text{font-size:1em;line-height:1.6}
/* コンテンツ層 */
.content{position:absolute;left:0;right:0;top:2.8em;bottom:8.6em;z-index:6;overflow:auto;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:.6em;padding:0 4%}
.content::-webkit-scrollbar{width:6px}.content::-webkit-scrollbar-thumb{background:#2a3040;border-radius:3px}
/* 準備コントロール（VN上に浮かせる） */
.ready{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(3.4% + 5.2em);z-index:9;
  display:flex;align-items:center;gap:.6em}
.readydots{display:flex;gap:.35em}
.dot{width:.7em;height:.7em;border-radius:50%;background:#3a3f57}.dot.on{background:var(--ok)}
.nextbtn{background:var(--shu);color:#fff;border:1px solid var(--shu);border-radius:999px;padding:.45em 1.5em;font-size:.95em;box-shadow:0 4px 16px rgba(201,70,60,.4)}
.nextbtn.off{background:transparent;color:var(--sub);border-color:var(--line);box-shadow:none}
/* 和紙スリップ（手がかり） */
.slips{display:flex;flex-wrap:wrap;gap:.7em;justify-content:center;align-items:flex-start;max-width:100%;margin:auto 0}
.washi{width:min(15em,44%);background:linear-gradient(#efe6cf,#e2d6ba);color:var(--paperink);border:1px solid #b7a880;border-radius:.25em;
  padding:.7em .8em;box-shadow:0 8px 20px rgba(0,0,0,.5);font-size:.9em;line-height:1.55}
.washi.secret{background:linear-gradient(#251b1f,#191115);color:#f0d9d4;border-color:var(--shu)}
.washi .wt{font-weight:600;margin-bottom:.15em;display:flex;justify-content:space-between;gap:.4em;align-items:baseline}
.washi .wk{font-size:.72em;color:#8a7c5c;margin-bottom:.3em}.washi.secret .wk{color:#cc9}
.washi .core{font-size:.66em;border:1px solid currentColor;border-radius:999px;padding:0 .5em;opacity:.7;white-space:nowrap}
/* 選択の札（プラーク） */
.plaques{display:grid;grid-template-columns:repeat(3,1fr);gap:.7em;width:min(42em,100%);margin:auto 0}
.plaque{background:linear-gradient(#1d2231,#12151f);border:1px solid #39415c;border-radius:.4em;color:var(--washi);
  padding:.95em .6em;font-size:1em;text-align:center;letter-spacing:.05em;box-shadow:0 4px 14px rgba(0,0,0,.45);transition:.15s}
.plaque:hover{border-color:var(--ao)}
.plaque.sel{border-color:var(--shu);background:linear-gradient(#2a1e22,#1a1216);box-shadow:0 0 0 1px var(--shu),0 4px 16px rgba(0,0,0,.55)}
/* ナレーション/一般カード（半透明スラブ） */
.card{background:rgba(12,15,24,.8);border:1px solid var(--line);border-radius:.5em;padding:.85em 1em;margin:.5em 0;
  max-width:44em;width:100%;line-height:1.75;backdrop-filter:blur(2px)}
.card.mine{border-color:var(--shu)}
.card.sub{color:var(--sub)}
/* キャラ選択 */
.charstage{position:absolute;inset:0;z-index:6;display:flex;align-items:flex-end;justify-content:center;gap:1.1em;padding:0 3% 9.2em}
.charpick{flex:1;max-width:12em;cursor:pointer;text-align:center;opacity:.85;transition:.18s}
.charpick:hover{opacity:1;transform:translateY(-5px)}
.charpick.sel{opacity:1}
.charpick .fig{height:15em;display:flex;align-items:flex-end;justify-content:center}
.charpick .fig .ph{margin:0;width:100%;height:100%}
.charpick .fig .box{min-height:100%;height:100%;border-radius:.4em}
.charpick .fig img{max-height:100%;width:100%;object-fit:contain;filter:drop-shadow(0 8px 16px rgba(0,0,0,.6))}
.charpick.sel .fig img,.charpick.sel .fig .box{filter:drop-shadow(0 0 12px rgba(201,70,60,.55));border-color:var(--shu)}
.charpick .cn{margin-top:.25em;font-size:1.05em}
.charpick .ct{font-size:.72em;color:var(--sub);min-height:2.4em}
.charpick.taken{opacity:.32;pointer-events:none}
/* タイトル */
.title-over{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;justify-content:center;padding:0 8%}
.title-logo{font-size:3.6em;letter-spacing:.16em;text-shadow:0 3px 18px #000}
.title-sub{color:var(--sub);font-size:.92em;margin:.3em 0 1.4em}
.title-menu{display:flex;flex-direction:column;gap:.5em;max-width:16em}
.title-menu .btn{font-size:1.1em;width:100%}
.stamp{align-self:flex-start;border:1px solid var(--ao);color:var(--ao);border-radius:.3em;font-size:.72em;padding:.1em .7em;letter-spacing:.22em;margin-bottom:.6em}
/* 入力 */
.field{width:min(24em,100%);margin:auto 0}
input.txt{width:100%;background:rgba(9,11,18,.82);border:1px solid var(--line);border-radius:.4em;color:var(--washi);padding:.7em;font-size:1em;margin:.2em 0}
select.txt{width:100%;background:rgba(9,11,18,.82);border:1px solid var(--line);border-radius:.4em;color:var(--washi);padding:.7em;font-size:1em;margin:.2em 0}
.lbl{display:block;font-size:.82em;color:var(--sub);margin:.6em 0 .1em}
/* ボタン */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;background:rgba(20,24,36,.72);color:var(--washi);
  border:1px solid var(--line);border-radius:.5em;padding:.7em 1.1em;font-size:1em;margin:.3em 0}
.btn.primary{background:var(--shu);border-color:var(--shu);color:#fff}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed}
/* 小物 */
.center{text-align:center}.sub{color:var(--sub)}.small{font-size:.82em;color:var(--sub)}
.kv{font-size:.9em;color:var(--sub);margin:.15em 0}
hr.sep{border:none;border-top:1px solid var(--line);margin:.8em 0}
.tag{display:inline-block;font-size:.7em;color:var(--ao);border:1px solid var(--ao);border-radius:999px;padding:0 .6em;margin-left:.3em}
.pill{display:inline-block;font-size:.72em;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:0 .5em;margin:.1em}
.badge{display:inline-block;font-size:.72em;padding:.15em .7em;border-radius:999px;margin-bottom:.4em}
.badge.priv{background:#2a1e22;color:#e8b6b0;border:1px solid var(--shu)}
.badge.pub{background:#132430;color:#bfe0f0;border:1px solid var(--ao)}
.timer{font-size:2.8em;letter-spacing:.06em;text-align:center;margin:.1em 0}
.timer.over{color:var(--warn)}
.q{width:min(42em,100%);margin:.35em 0;padding-bottom:.35em;border-bottom:1px solid var(--line)}
.sfx{display:inline-flex;align-items:center;gap:.3em;font-size:.72em;color:var(--ao);border:1px solid var(--ao);border-radius:999px;padding:0 .6em;margin:.2em}
.ph img{display:block;width:100%}
/* マップ選択 */
.mapwrap{position:absolute;inset:0}
.mapnode{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:.25em;
  background:none;border:none;padding:0;cursor:pointer}
.mapnode .pin{position:absolute;top:-1.4em;font-size:1.1em;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
.nicon{position:relative;width:3.4em;height:3.4em;border-radius:.55em;overflow:hidden;border:2px solid rgba(233,228,214,.55);
  background:linear-gradient(#1a1f2b,#0f131c);box-shadow:0 5px 14px rgba(0,0,0,.55);transition:.15s}
.nicon img{width:100%;height:100%;object-fit:cover}
.nicon .ficon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.5em;color:var(--washi)}
.nlabel{background:rgba(9,11,18,.85);border:1px solid var(--line);border-radius:.3em;padding:.05em .55em;font-size:.8em;white-space:nowrap;backdrop-filter:blur(1px)}
.mapnode:hover .nicon{border-color:var(--ao);transform:translateY(-2px)}
.mapnode.sel .nicon{border-color:var(--shu);box-shadow:0 0 0 2px var(--shu),0 6px 16px rgba(0,0,0,.6)}
.mapnode.sel .nlabel{border-color:var(--shu);color:#fff}
/* 手引きシート（和風・レイアウト固定＝タブや閉じるが動かない） */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.74);z-index:50;display:none}
.sheet.open{display:block}
.sheet .inner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(760px,94vw);height:min(84vh,640px);overflow:hidden;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#14100f,#0f1119);border:1px solid var(--shu);border-radius:12px;
  box-shadow:0 20px 60px rgba(0,0,0,.7);padding:0}
.sheet-head{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;padding:.7em 1em;
  border-bottom:1px solid var(--line);background:linear-gradient(#1b1016,#12141d)}
.sheet-title{color:var(--shu);letter-spacing:.45em;font-size:1.15em}
.sheet-x{background:none;border:1px solid var(--line);color:var(--washi);border-radius:.4em;padding:.15em .6em;font-size:1em;cursor:pointer}
.tabs{flex:0 0 auto;display:flex;gap:6px;overflow-x:auto;padding:.7em 1em;border-bottom:1px solid var(--line);background:rgba(0,0,0,.2)}
.tab{white-space:nowrap;padding:.45em .9em;border:1px solid var(--line);border-radius:999px;background:var(--ink2);color:var(--sub);cursor:pointer;font-size:.85em}
.tab.on{color:var(--washi);border-color:var(--shu);background:#241a1e}
.sheet-body{flex:1 1 auto;overflow:auto;padding:1em 1.1em 1.6em}
.sheet-body::-webkit-scrollbar{width:7px}.sheet-body::-webkit-scrollbar-thumb{background:#2a3040;border-radius:4px}
/* ===== 横長：場面を左に、道具を右パネルにドッキング（マダミス/ココフォリア風） ===== */
:root{--dock:min(480px,42vw)}
@media (min-width:980px) and (orientation:landscape){
  body.paneled{justify-content:flex-start}
  body.paneled #app{
    width:min(calc(100vw - var(--dock)), calc(100vh*16/9));
    height:min(100vh, calc((100vw - var(--dock))*9/16));
  }
  /* パネル本体（右ドック・全高）。背景は透かして場面を残す */
  body.paneled .sheet{background:transparent;pointer-events:none}
  body.paneled .sheet.open{pointer-events:none}
  .sheet.open .inner{pointer-events:auto}
  @media (min-width:980px) and (orientation:landscape){
    .sheet .inner{
      left:auto;right:0;top:0;transform:none;
      width:var(--dock);height:100vh;max-height:100vh;border-radius:0;
      border:none;border-left:2px solid var(--shu);box-shadow:-14px 0 40px rgba(0,0,0,.55)}
  }
}
.sheet .card{background:var(--ink2);backdrop-filter:none;animation:none}
.sheet ul{margin:.3em 0 .3em 1.1em;padding:0}
/* 一時停止 */
.pauseOverlay{position:fixed;inset:0;background:rgba(5,6,10,.92);z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.pauseOverlay.on{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* 上部フェイズ帯（常時：今なにをする＋話していい/ミュート） */
.topbar{position:absolute;top:0;left:0;right:0;z-index:9;display:flex;align-items:center;gap:.55em;
  padding:.5em .8em;background:linear-gradient(rgba(6,7,12,.85),rgba(6,7,12,.2));pointer-events:none}
.topbar .pb{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.topbar .pbl{font-size:.94em;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .pbs{font-size:.72em;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:22em}
.voice{font-size:.74em;border-radius:999px;padding:.15em .7em;border:1px solid;white-space:nowrap}
.voice.talk{color:#8fd6ac;border-color:#3f7d63;background:rgba(63,125,99,.15)}
.voice.mute{color:#e6aaaa;border-color:var(--shu);background:rgba(201,70,60,.12)}
.voice.listen{color:#bfe0f0;border-color:var(--ao);background:rgba(90,143,176,.14)}
.topbar .spacer{flex:1}
.tbtn{pointer-events:auto;background:rgba(20,24,36,.74);border:1px solid var(--line);color:var(--washi);
  border-radius:999px;padding:.3em .7em;font-size:.8em;white-space:nowrap}
.tbtn:hover{border-color:var(--ao)}
.readbtn{pointer-events:auto;background:none;border:none;color:var(--sub);font-size:1.05em;cursor:pointer;padding:.1em .3em}
.readbtn:hover{color:var(--washi)}
/* 手がかりの“照合しるし” */
.washi .link{font-size:.66em;color:#9a7c3c;border:1px solid #b7a880;border-radius:999px;padding:0 .5em;white-space:nowrap}
.washi.secret .link{color:#cc9;border-color:var(--shu)}
/* 場所の概要（マップ選択で選んだ拠点） */
.locinfo{position:absolute;left:4%;right:4%;bottom:.4em;z-index:7;text-align:center;
  background:rgba(9,11,18,.82);border:1px solid var(--line);border-radius:.5em;padding:.5em .8em;font-size:.85em;line-height:1.5}
.locinfo b{color:var(--washi)}
/* 参加者チップ（ロビー） */
.roster{position:absolute;top:2.6em;left:0;right:0;z-index:8;display:flex;gap:.5em;flex-wrap:wrap;justify-content:center;padding:0 4%}
.rchip{display:flex;align-items:center;gap:.4em;background:rgba(20,24,36,.78);border:1px solid var(--line);border-radius:999px;padding:.25em .8em;font-size:.82em}
.rchip .rc{width:.7em;height:.7em;border-radius:50%;background:#3a3f57}
.rchip.done .rc{background:var(--ok)}
.rchip .rn{color:var(--washi)}.rchip .rk{color:var(--sub)}
/* クルーボード */
.bloc{margin:.55em 0;border:1px solid var(--line);border-radius:.5em;padding:.55em .7em;background:rgba(20,24,36,.4)}
.blname{color:var(--shu);font-size:.98em;margin-bottom:.15em;letter-spacing:.05em}
.blov{color:var(--sub);font-size:.78em;margin-bottom:.35em}
.bcard{background:linear-gradient(#efe6cf,#e2d6ba);color:var(--paperink);border:1px solid #b7a880;border-radius:.3em;padding:.5em .6em;margin:.35em 0;font-size:.9em;line-height:1.55}
.bcard.shared{background:linear-gradient(#e6ecf3,#d6dde8)}
.bcard .wt{display:flex;justify-content:space-between;gap:.4em;font-weight:600;margin-bottom:.2em;align-items:baseline;flex-wrap:wrap}
.bcard .pill{color:#8a7c5c;border-color:#b7a880}
.bcard.shared .pill{color:#5a6b86;border-color:#9fb0c8}
.brow{margin-top:.35em;display:flex;gap:.45em;align-items:center;flex-wrap:wrap}
.pubsel{background:#1d2231;color:var(--washi);border:1px solid var(--line);border-radius:.3em;padding:.25em .4em;font-size:.82em}
/* ボード：未発見=裏／内容ロック */
.bcard.facedown{background:repeating-linear-gradient(45deg,#171a24,#171a24 8px,#1b1f2b 8px,#1b1f2b 16px);color:#5b6079;border:1px dashed #333a52;text-align:center;font-size:.85em}
.bcard.locked{background:linear-gradient(#262b39,#1d222e);color:#aeb4c8;border-color:#3a4159}
.bcard.locked .pill{color:#9aa0b4;border-color:#3a4159}
.bcard .who{font-size:.72em;color:#8a7c5c}
.bcard.locked .who,.bcard.shared .who{color:inherit}
/* 密談チャット */
.dmlog{max-height:52vh;overflow:auto;display:flex;flex-direction:column;gap:.4em;margin:.6em 0;padding:.2em}
.dmmsg{align-self:flex-start;max-width:82%;background:var(--ink2);border:1px solid var(--line);border-radius:.6em;padding:.4em .7em;font-size:.92em;line-height:1.5}
.dmmsg.mine{align-self:flex-end;background:#2a1e22;border-color:var(--shu)}
.dmname{display:block;font-size:.68em;color:var(--sub);margin-bottom:.1em}
.dmin{display:flex;gap:.5em;margin-top:.4em}
.dmin .txt{flex:1}
/* 事件の再構成 */
.tlitem{display:flex;align-items:center;gap:.6em;background:rgba(20,24,36,.55);border:1px solid var(--line);border-radius:.4em;padding:.5em .6em;margin:.3em 0}
.tlno{flex:0 0 1.6em;height:1.6em;border-radius:50%;background:var(--shu);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.8em}
.tltext{flex:1;font-size:.9em;line-height:1.4}
.tlbtns{display:flex;gap:.25em}
/* 達成ランク */
.rankbadge{display:inline-flex;align-items:center;justify-content:center;width:2.4em;height:2.4em;border-radius:50%;font-size:1.6em;font-weight:700;border:2px solid;letter-spacing:0}
.rank-S{color:#f0d078;border-color:#f0d078;background:rgba(240,208,120,.12)}
.rank-A{color:#8fd6ac;border-color:#8fd6ac;background:rgba(143,214,172,.12)}
.rank-B{color:#bfe0f0;border-color:#5a8fb0;background:rgba(90,143,176,.12)}
.rank-C{color:#e6b38a;border-color:#c98a5a;background:rgba(201,138,90,.12)}
.rank-D{color:#c98;border-color:#7a5a5a;background:rgba(120,90,90,.12)}
.fournames{display:flex;gap:.5em;justify-content:center;flex-wrap:wrap;margin:.5em 0}
.fournames .np{min-width:3.4em;padding:.35em .6em;border-radius:.5em;border:1px dashed #454b63;color:#5b6079;font-size:.85em}
.fournames .np.on{border-style:solid;border-color:var(--shu);color:var(--washi);background:rgba(201,70,60,.12)}
.fournames .np.part{border-style:solid;border-color:#b7a880;color:#e6dcc0;background:rgba(183,168,128,.12)}
/* マップ拠点のカード枠ピップ＆一覧 */
.npips{display:flex;gap:2px;justify-content:center;margin-top:2px;flex-wrap:wrap;max-width:5em}
.npip{width:.5em;height:.5em;border-radius:1px;background:#2a3040;border:1px solid #464d66}
.npip.open{background:var(--ao);border-color:var(--ao)}
.slotlist{margin:.4em 0;max-height:9em;overflow:auto}
.slotrow{display:flex;justify-content:space-between;gap:.6em;font-size:.8em;padding:.15em 0;border-bottom:1px solid rgba(255,255,255,.06)}

const TRUTH = `――では、あの夜と、十七年前を、ひとつに。

十七年前、祭りの夜。旧校舎が燃えた。原因は、村の防災倉庫に違法に置かれていた燃料への引火。管理していたのは、村側の大人たちだった。
責任を恐れた彼らは、火の直前に倉庫へ入っていた五人の子どものうち、燃料の在り処を知っていた“あの子”ひとりに、罪を着せた。あの子は否定した。だが大人たちは『名預け』を悪用し、あの子の名を記録から外し、残る四人にも『あの子のことは話すな』と沈黙を強いた。
あの子の名は――千代。火をつけてなど、いなかった。

名前が消えたから記憶が消えたのではない。幼かったこと、話すことを禁じられたこと、記録から千代が消されたこと――それが重なって、名も顔も、曖昧になっていった。

そして現在。巌は、古文書の改ざん痕と、防災倉庫の鍵台帳から、真相へたどり着く。火災当夜に鍵を持ち出したのは、今の村長――透の父だった。
巌は千代の名を戻すため、四人の断片的な記憶をつなごうとした。千景に木札を、蓮司に封筒を、紗良には証言を託し、透にも父の記録を示した。
だが透は、父を、家を、村を守るため――そして自分もまた、あの火災で弟を失った“被害者”であるがゆえに揺れながら――巌の証拠帳を奪おうとした。

水車小屋から、山道へ。崖際で、巌は言った。『父親を守るために、また誰かの名前を消すのか』。
透は逆上し、巌の肩を強く押した。巌は転落した。……そして透は、まだ息のある巌を見殺しにし、通報を遅らせた。
これは事故ではない。透による、殺人だ。

蓮司が巌の腕をつかんだのは、その“あと”。落ちる直前の一瞬だけを見て、自分が落としたと思い込んだ。

巌が遺した『四つの名前を集めろ』――それは、四人それぞれの記憶をつなげれば、消された五人目の名が戻る、という意味だった。四つの名前が、一つの名前を取り戻す。

だからこの物語の問いは、ひとつではない。巌を殺したのは誰か。十七年前、千代は本当に犯人だったのか。そして――また一人に責任を集めて終わらせるのか、それとも、村がしてきたことごと、記録に残すのか。

さて。あなたたちは、どう終わらせた?`;

function players(){ return room?.players ? Object.entries(room.players).map(([id,v])=>({id,...v})) : []; }
function connectedPlayers(){ return players().filter(p=>p.connected); }
function isLeader(){ const c=connectedPlayers().map(p=>p.id).sort(); return c.length && c[0]===me; }
function myPlayer(){ return room?.players?.[me]; }
function myChar(){ return myPlayer()?.char; }
function charTaken(cid){ return players().some(p=>p.char===cid); }
function allJoinedConnected(){ const ps=players(); return ps.length>0 && ps.every(p=>p.connected); }
function readyCount(){ const r=room?.ready||{}; return connectedPlayers().filter(p=>r[p.id]).length; }
function iAmReady(){ return !!(room?.ready||{})[me]; }
async function setReady(v){ await roomRef.child("ready/"+me).set(v?true:null); }

function ensureReady(v){ if(!!v!==iAmReady()) setReady(v); }

// リーダーが「全員準備OK」を検知して次へ
async function maybeAdvance(){
  if(!isLeader()) return;
  if(!allJoinedConnected()) return;
  const cp=connectedPlayers();
  if(cp.length===0) return;
  const need = cp.length;
  if(readyCount()>=need){
    const ph=FLOW[room.step];
    // 最終投票が同票なら進めず、やり直し（データ並び順で勝手に決めない）
    if(ph && ph.k==="vote" && voteTie()){
      await roomRef.update({ voteRedo:(room.voteRedo||0)+1 });
      await roomRef.child("ready").remove();
      await roomRef.update({ vMurder:null, vCulprit:null, vChiyo:null, vName:null, vResp:null });
      return;
    }
    const cur=room.step;
    await roomRef.child("ready").remove();
    await roomRef.update({ step: cur+1 });
  }
}
function isTie(map){
  const t={}; Object.values(map||{}).forEach(v=>t[v]=(t[v]||0)+1);
  const n=Object.values(t); if(n.length<2) return false;
  const mx=Math.max(...n); return n.filter(x=>x===mx).length>1;
}
// 決定的な二問（殺人か・犯人）が割れたら再投票
function voteTie(){ return isTie(room.vMurder)||isTie(room.vCulprit); }

function speak(text){
  try{
    if(!('speechSynthesis' in window)||!text) return;
    if(speechSynthesis.speaking){ speechSynthesis.cancel(); return; }
    const u=new SpeechSynthesisUtterance(String(text).replace(/\n/g,'、'));
    u.lang='ja-JP'; u.rate=0.96; u.pitch=1;
    speechSynthesis.speak(u);
  }catch(e){}
}

async function publishCard(loc,cardId,to){
  if(!to) return;
  const items=(room.disc&&room.disc[me])?Object.values(room.disc[me]):[];
  const it=items.find(x=>x.id===cardId);

}
async function unpublishCard(cardId){ await roomRef.child("shared/"+me+"_"+cardId).remove(); renderBoard(); }
function readableCard(cardId){
  if(room.discovered && room.discovered[cardId] && room.discovered[cardId][me]) return true;
  const shared=room.shared?Object.values(room.shared):[];
  return shared.some(s=>s.id===cardId && (s.to==="all"||s.to===me));
}
function cardDataById(cardId){
  const mine=(room.disc&&room.disc[me])?Object.values(room.disc[me]):[];
  const it=mine.find(x=>x.id===cardId); if(it) return it;
  const shared=room.shared?Object.values(room.shared):[];
  return shared.find(s=>s.id===cardId && (s.to==="all"||s.to===me))||null;
}
function boardCard(c, l){
  const disc = (room.discovered&&room.discovered[c.id])?Object.keys(room.discovered[c.id]):[];
  if(!disc.length){
    return `<div class="bcard facedown">？　未発見の手がかり</div>`;
  }
  const who = disc.map(charName).join("、");
  const iHave = disc.includes(me);
  const readable = readableCard(c.id);
  const link = c.combo?`<span class="pill">🔗</span>`:"";
  if(readable){
    const d=cardDataById(c.id)||c;
    let inner=`<div class="wt"><span>${esc(d.name||c.name)}</span>${link}<span class="pill">発見: ${esc(who)}</span></div><div>${nl2br(d.text)}</div>`;
    if(iHave){
      const already=room.shared&&room.shared[me+"_"+c.id];
      if(already){
        const toL=already.to==="all"?"全員":charName(already.to);
        inner+=`<div class="brow"><span class="pill">✅ 公開中 → ${esc(toL)}</span><button class="tbtn" onclick="unpublishCard('${c.id}')">取り消す</button></div>`;
      }else{
        inner+=`<div class="brow"><select class="pubsel" onchange="publishCard('${l}','${c.id}',this.value)"><option value="">🔓 公開する…</option><option value="all">全員に</option>`;
        players().filter(p=>p.id!==me).forEach(p=>inner+=`<option value="${p.id}">${esc(charName(p.id))}だけに</option>`);
        inner+=`</select></div>`;
      }
    }else{
      inner+=`<div class="brow"><span class="pill">🔓 共有で見えている</span></div>`;
    }
    return `<div class="bcard">${inner}</div>`;
  }
  // 発見済みだが内容は未共有（自分は読めない）
  return `<div class="bcard locked"><div class="wt"><span>？？？（発見済み）</span><span class="pill">発見: ${esc(who)}</span></div>
    <div class="who">内容は未共有。${esc(who)}に聞いてみよう。</div></div>`;
}
function renderBoard(){

function closeDM(){ $("#dm").classList.remove("open"); dmWith=null; syncPaneled(); }
function pairKey(a,b){ return [a,b].sort().join("_"); }
function renderDM(){
  const body=$("#dmBody"), title=$("#dmTitle"); if(!body) return;
  if(!dmWith){
    title.textContent="密談する相手を選ぶ";
    let out=`<p class="sub">選んだ相手と、二人だけの秘密のチャット。<b>他の人には見えないし、密談していること自体も分からない</b>よ。</p>`;

    body.innerHTML=out; return;
  }
  title.textContent="🔒 "+charName(dmWith)+" と密談中";
  let out=`<button class="tbtn" onclick="dmWith=null;renderDM()">← 相手を変える</button><div class="dmlog"></div>
    <div class="dmin"><input class="txt" id="dmText" placeholder="メッセージ…" onkeydown="if(event.key==='Enter')sendDM()"><button class="btn primary" onclick="sendDM()">送信</button></div>`;
  body.innerHTML=out; dmTick();
}
function dmTick(){
  if(!dmWith) return;
  const log=$("#dmBody .dmlog"); if(!log) return;
  const pk=pairKey(me,dmWith);
  const msgs=(room&&room.dm&&room.dm[pk])?Object.values(room.dm[pk]).sort((a,b)=>(a.t||0)-(b.t||0)):[];
  log.innerHTML = msgs.length? msgs.map(m=>`<div class="dmmsg ${m.by===me?'mine':''}"><span class="dmname">${esc(charName(m.by))}</span>${esc(m.text)}</div>`).join("")
    : `<p class="sub">まだメッセージはないよ。</p>`;
  log.scrollTop=log.scrollHeight;
}
async function sendDM(){
  const inp=$("#dmText"); if(!inp) return;

/* リーダーがフェーズ入口で1回だけ計算する処理 */
async function ensureComputed(step, ph){
  if(!isLeader()) return;
  if((room.computedStep||-1) >= step) return;
  if(computing) return;
  computing=true;
  try{
    if(ph.k==="cards"){ await computeCards(ph.r); }
    else if(ph.k==="guarantee"){ await computeGuarantee(); }
    await roomRef.child("computedStep").set(step);
  }finally{ computing=false; }
}

function needsReady(ph){
  return ["prologue","briefing","hoview","intro","cards","discuss","guarantee","select","confession","deduct1","deduct2","vote","truth"].includes(ph.k);
}
function isSubmitPhase(ph){ return ["select","confession","deduct1","deduct2","vote"].includes(ph.k); }

/* ---------- 各フェーズ描画 ---------- */
function renderPhase(step, ph){
  switch(ph.k){
    case "prologue": return phPrologue();
    case "briefing": return phBriefing();
    case "hoview":   return phHoView();
    case "intro":    return phIntro();
    case "select":   return phSelect(ph);
    case "cards":    return phCards(ph);
    case "discuss":  return phDiscuss(step, ph);
    case "guarantee":return phGuarantee();
    case "confession":return phConfession();
    case "deduct1":  return phDeduct1();
    case "deduct2":  return phDeduct2();
    case "vote":     return phVote();
    case "truth":    return phTruth();
    case "ending":   return phEnding();
  }
  return "";
}

/* カード計算：発見は“行った本人だけ”に配る。照合(X06)は同行者へ1回。C01→C02の順序ロック。 */
async function computeCards(r){
  const sel=room.sel||{};
  const perLoc={};
  Object.entries(sel).forEach(([pid,l])=>{ (perLoc[l]=perLoc[l]||[]).push(pid); });

  for(const l of Object.keys(perLoc)){
    const loc=LOCS[l];
    const tier = (r===1? loc.first : loc.second) || [];
    for(const pid of perLoc[l]){
      const held=heldIds(pid);
      const chosen=(room.examine&&room.examine[pid])||null;
      // 「何を調べるか」で選んだ手がかりを1つだけ取得（未選択なら、条件を満たす先頭を1つ）
      let target = chosen ? tier.find(c=>c.id===chosen) : null;
      if(!target){ target = tier.find(c=>!(room.gaveCard&&room.gaveCard[pid+"_"+c.id]) && !held.has(c.id) && (!c.req||held.has(c.req))) || null; }
      if(target){
        const c=target;
        const ok = !(room.gaveCard&&room.gaveCard[pid+"_"+c.id]) && !held.has(c.id) && (!c.req||held.has(c.req));
        if(ok){
          await pushDisc(pid,{round:r,kind:"探索",id:c.id,name:c.name,kei:c.kei,combo:c.combo||0,text:c.text,loc:l});
          await roomRef.child("gaveCard/"+pid+"_"+c.id).set(true);
          await roomRef.child("discovered/"+c.id+"/"+pid).set(true);
          held.add(c.id);
        }
      }
    }
    // 照合：2人以上で同行→その場所専用の照合を1回だけ、その本人たちへ
    if(perLoc[l].length>=2 && COLLATION[l] && !(room.coDone&&room.coDone[l])){
      const X=COLLATION[l];
      for(const pid of perLoc[l]) await pushDisc(pid,{round:r,kind:"照合",id:X.id,name:X.name,kei:X.kei,combo:X.combo||0,text:X.text,loc:l});
      for(const pid of perLoc[l]) await roomRef.child("discovered/"+X.id+"/"+pid).set(true);
      await roomRef.child("coDone/"+l).set(true);
    }
  }
  await roomRef.child("examine").remove();   // この巡の“何を見る”をリセット（次の巡で選び直し）
  playSfx("reveal");
}
// そのプレイヤーが今持っているカードIDの集合
function heldIds(pid){
  const set=new Set();
  const d=(room.disc&&room.disc[pid])?Object.values(room.disc[pid]):[];
  d.forEach(x=>{ if(x.id) set.add(x.id); });
  return set;
}

function phCards(ph){
  const all=(room.disc&&room.disc[me])?Object.values(room.disc[me]):[];
  const now=all.filter(x=>x.round===ph.r);
  let html = privBadge();
  if(!now.length) return html+`<div class="slips"><div class="washi">…ここでは、何も見つからなかった。</div></div>`;
  html+=`<div class="slips">`;
  now.forEach(c=>{
    const link = c.combo?`<span class="link">🔗 照合の余地</span>`:"";
    const isX = c.kind==="照合";
    html+=`<div class="washi ${isX?'secret':''}"><div class="wt"><span>${esc(c.name||c.id||"手がかり")}</span>${link}</div><div>${nl2br(c.text)}</div></div>`;

/* 救済（第二探索終了時：足りない系統を全員へ補う） */
async function computeGuarantee(){
  if(room.guaranteeDone) return;
  const have=keiCoveredSet();
  const missing=["past","name","murder"].filter(k=>!have.has(k));
  const list=missing.map(k=>({k,label:KEI[k],hint:RESCUE[k].hint}));
  await roomRef.child("guarantee").set(list);
  await roomRef.child("guaranteeDone").set(true);
}
// グループ全体でどの系統が“実際に”出ているか（救済ヒントは含めない＝見落としは埋めない）
function keiCoveredSet(){
  const set=new Set();
  const disc=room.disc||{};
  Object.values(disc).forEach(list=>Object.values(list||{}).forEach(c=>{ if(c.kei) set.add(c.kei); }));
  return set;
}
function phGuarantee(){
  const g=room.guarantee||[];
  if(!g.length) return `${pubBadge()}<div class="card"><b>……よく歩いたね</b><p class="sub">大きな見落としは、なさそう。あとは、言葉にできるかどうか。</p></div>`;

  g.forEach(x=>html+=`<hr class="sep"><span class="tag">${esc(x.label)}</span><p>${nl2br(x.hint)}</p>`);

function phConfession(){
  const c=myChar(); const rv=c?CHARS[c].ho.reveal:null;
  const my = room.confess && room.confess[me];
  const isCulprit = (c==="toru");
  const label={open:"✅ すべて公開した",part:"◐ 一部だけ認めた",hide:isCulprit?"🤫 最後まで否認した":"🤫 隠したままにした"}[my]||"";
  let html=`${privBadge()}<div class="card mine" style="max-width:42em"><b>🗝 あなただけが握る、決定的な情報</b>`;
  if(rv) html+=`<p><b>${esc(rv.title)}</b><br>${nl2br(rv.text)}</p><p class="small">${esc(rv.note||"")}</p>`;
  if(isCulprit){
    html+=`<hr class="sep"><p class="small">あなたは犯人。……どう、幕を引く? 隠し通すのも、罪だけ認めるのも、すべてを差し出すのも、あなたの選択。</p>`;
  }else{
    html+=`<hr class="sep"><p class="small">これを公開すると、真相に一歩近づく。でも自分から出すと、疑いを呼ぶかも。出すか、隠すかは、あなたの判断。</p>`;
  }
  if(my){
    html+=`<p><span class="pill">${label}</span> <button class="tbtn" onclick="setConfess(null)">選び直す</button></p>`;
  }else if(isCulprit){
    html+=`<div class="brow"><button class="nextbtn" onclick="setConfess('open')">すべて認める</button><button class="btn" onclick="setConfess('part')">罪だけ認める</button><button class="btn" onclick="setConfess('hide')">否認する</button></div>`;
  }else{
    html+=`<div class="brow"><button class="nextbtn" onclick="setConfess('open')">公開する</button><button class="btn" onclick="setConfess('hide')">まだ隠す</button></div>`;
  }
  html+=`</div>`;
  // “四つの名前”が揃っていく（公開＝open / 一部＝part も灯すが色を分ける）
  const pubs=Object.entries(room.confess||{}).filter(([pid,v])=>v==="open"||v==="part");
  const nFull=Object.values(room.confess||{}).filter(v=>v==="open").length;
  const pips=CHAR_ORDER.map(cid=>{ const st=charConfessState(cid); return `<span class="np ${st==='open'?'on':(st==='part'?'part':'')}">${st?CHARS[cid].name:'？'}</span>`; }).join("");
  html+=`<div class="card" style="max-width:42em;text-align:center"><b>四つの名前</b>
    <div class="fournames">${pips}</div>
    <div class="kv">${nameGathered()?"――四つの名前が、それぞれの意思で、揃った。":`${pubs.length} / 4 の名前が、明かされた`}</div></div>`;
  if(pubs.length){
    html+=`<div class="card" style="max-width:42em"><b>明かされた決定的情報</b>`;
    pubs.forEach(([pid,v])=>{
      const pl=players().find(p=>p.id===pid); const kk=pl&&pl.char?CHARS[pl.char].ho.reveal:null;
      if(kk) html+=`<hr class="sep"><p><b>${esc(charName(pid))}：${esc(kk.title)}${v==="part"?"（一部）":""}</b><br>${nl2br(kk.text)}</p>`;
    });
    html+=`</div>`;
  }
  ensureReady(!!my);
  return html;
}
async function setConfess(v){ await roomRef.child("confess/"+me).set(v?v:null); }
function confessCount(){ return Object.values(room.confess||{}).filter(v=>v==="open").length; }
function charConfessState(cid){ const p=players().find(x=>x.char===cid); return (p&&room.confess)?room.confess[p.id]:null; }
// “四つの名前”＝四人それぞれが「何を残すか」を自分の意思で決めた（隠す以外を選んだ）
function nameGathered(){
  return CHAR_ORDER.every(cid=>{ const st=charConfessState(cid); return st==="open"||st==="part"; });
}

/* ⑤-① 事件の再構成：共有の並びを全員で上下、各自が確定 */
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function phDeduct1(){
  if(isLeader() && !room.tl){ roomRef.child("tl").set(shuffle(TIMELINE.map(e=>e.id))); }
  const order = room.tl || TIMELINE.map(e=>e.id);
  const done = room.tlok && room.tlok[me];
  let html=`<div class="card" style="max-width:44em"><b>① 事件の再構成</b><p class="sub">起きた順に、みんなで並べ替えよう（▲▼）。全員が「確定」で次へ。</p>`;
  order.forEach((id,i)=>{
    const e=TIMELINE.find(x=>x.id===id)||{text:id};
    html+=`<div class="tlitem"><span class="tlno">${i+1}</span><span class="tltext">${esc(e.text)}</span>
      <span class="tlbtns"><button class="tbtn" ${i===0?'disabled':''} onclick="tlMove(${i},-1)">▲</button><button class="tbtn" ${i===order.length-1?'disabled':''} onclick="tlMove(${i},1)">▼</button></span></div>`;
  });
  html+=`</div>`;
  if(done) html+=`<p class="center"><span class="pill">✅ この並びで確定</span> <button class="tbtn" onclick="setTlOk(false)">やり直す</button></p>`;
  else html+=`<button class="nextbtn" onclick="setTlOk(true)">この並びで確定 ▶</button>`;
  ensureReady(!!done);
  return html;
}
async function tlMove(i,d){
  const o=(room.tl||TIMELINE.map(e=>e.id)).slice(); const j=i+d;
  if(j<0||j>=o.length) return; [o[i],o[j]]=[o[j],o[i]];
  await roomRef.child("tl").set(o);
  await roomRef.child("tlok").remove(); // 並びが変わったら全員の確定を解除
}
async function setTlOk(v){ await roomRef.child("tlok/"+me).set(v?true:null); }
function timelineCorrect(){ const o=room.tl||[]; return o.length===TL_CORRECT.length && o.every((id,i)=>id===TL_CORRECT[i]); }

/* ⑤-② 四人の行動 */
function phDeduct2(){
  const my=(room.da&&room.da[me])||{};
  let html=`<div class="card" style="max-width:44em"><b>② 四人の行動</b><p class="sub">誰が、何をした?（相談→各自回答、多数決）</p></div>`;
  DEDUCT_ACTIONS.forEach((d,i)=>{
    html+=`<div class="q"><div style="margin-bottom:.3em"><b>${esc(d.q)}</b></div>`;
    d.opt.forEach((o,j)=>html+=`<button class="plaque ${my[i]===j?'sel':''}" style="text-align:left;margin:.2em 0" onclick="ansAct(${i},${j})">${esc(o)}</button>`);
    html+=`</div>`;
  });
  const done = my && Object.keys(my).length===DEDUCT_ACTIONS.length;
  ensureReady(done);
  return html;
}
async function ansAct(i,j){ await roomRef.child("da/"+me+"/"+i).set(j); }
function actionScore(){
  let s=0;
  DEDUCT_ACTIONS.forEach((d,i)=>{
    const t={}; Object.values(room.da||{}).forEach(a=>{ if(a&&a[i]!=null) t[a[i]]=(t[a[i]]||0)+1; });
    let mx=-1,pk=null; Object.entries(t).forEach(([k,n])=>{if(n>mx){mx=n;pk=+k;}});
    if(pk===d.a) s++;
  });
  return s;
}

/* 最終投票（3種） */
function phVote(){
  const g=(k)=>room[k]&&room[k][me];
  const vm=g("vMurder"),vk=g("vCulprit"),v17=g("vChiyo"),vn=g("vName"),vr=g("vResp");
  let html="";
  if(room.voteRedo){ html+=`<div class="card mine" style="text-align:center"><b>意見が割れた</b><p class="sub">「殺人か／犯人は誰か」で票が同数だった。もう一度だけ、話し合って選び直そう。（${room.voteRedo}回目）</p></div>`; }
  html+=`<div class="card"><b>① 巌は、殺されたのか？</b><div class="plaques" style="margin-top:.4em;grid-template-columns:repeat(2,1fr)">`;
  [["殺された（殺人）","murder"],["事故だ","accident"]].forEach(([lab,v])=>html+=`<button class="plaque ${vm===v?'sel':''}" onclick="setVote('vMurder','${v}')">${lab}</button>`);
  html+=`</div></div>`;
  html+=`<div class="card"><b>② 犯人は誰か？</b><div class="plaques" style="margin-top:.4em">`;
  CHAR_ORDER.forEach(c=>html+=`<button class="plaque ${vk===c?'sel':''}" onclick="setVote('vCulprit','${c}')">${CHARS[c].name}</button>`);
  html+=`<button class="plaque ${vk==='none'?'sel':''}" onclick="setVote('vCulprit','none')">分からない</button>`;
  html+=`</div></div>`;
  html+=`<div class="card"><b>③ 十七年前、“あの子”は犯人だったか？</b><div class="plaques" style="margin-top:.4em;grid-template-columns:repeat(2,1fr)">`;
  [["犯人だった","guilty"],["無実だった","innocent"]].forEach(([lab,v])=>html+=`<button class="plaque ${v17===v?'sel':''}" onclick="setVote('vChiyo','${v}')">${lab}</button>`);
  html+=`</div></div>`;
  html+=`<div class="card"><b>④ 消された名前を、戻すか？</b><div class="plaques" style="margin-top:.4em;grid-template-columns:repeat(2,1fr)">`;
  [["戻す","return"],["封じる","seal"]].forEach(([lab,v])=>html+=`<button class="plaque ${vn===v?'sel':''}" onclick="setVote('vName','${v}')">${lab}</button>`);
  html+=`</div></div>`;
  html+=`<div class="card"><b>⑤ 責任を、どうする？</b><div class="plaques" style="margin-top:.4em;grid-template-columns:repeat(2,1fr)">`;
  [["犯人一人に集める","concentrate"],["村側の責任も記録する","record"]].forEach(([lab,v])=>html+=`<button class="plaque ${vr===v?'sel':''}" onclick="setVote('vResp','${v}')">${lab}</button>`);
  html+=`</div></div>`;
  ensureReady(vm&&vk&&v17&&vn&&vr);
  return html;
}
async function setVote(k,v){ await roomRef.child(k+"/"+me).set(v); if(k==="vMurder")playSfx("vote"); }

/* エンディング判定（v4・5投票） */
function majority(map){
  const t={}; Object.values(map||{}).forEach(v=>t[v]=(t[v]||0)+1);
  let mx=-1,c=[]; Object.entries(t).forEach(([k,n])=>{if(n>mx){mx=n;c=[k];}else if(n===mx)c.push(k);});
  return c[0];
}
// 真相到達＝殺人と見抜き・犯人=透・千代無実、まで揃ったか
function isShinso(){ return majority(room.vMurder)==="murder" && majority(room.vCulprit)==="toru" && majority(room.vChiyo)==="innocent"; }
function computeEnding(){
  const murder=majority(room.vMurder), culprit=majority(room.vCulprit), chiyo=majority(room.vChiyo), name=majority(room.vName), resp=majority(room.vResp);
  let ed;
  if(murder!=="murder" || culprit!=="toru") ed="4";            // 事故 or 犯人を確定できない
  else if(name==="seal") ed="3";                                // 透と当てたが、名を封じる＝また一人
  else if(chiyo==="innocent" && resp==="record") ed="1";        // 最良
  else if(chiyo==="innocent" && resp==="concentrate") ed="2";   // 千代は戻ったが、透一人へ
  else ed="5";                                                  // 名は戻すが、千代の無実/村の責任を残さない
  return {ed,murder,culprit,chiyo,name,resp};
}
function phTruth(){
  return `${pubBadge()}<div class="card">
    <p style="margin-top:2px">${nl2br(TRUTH)}</p></div>
    <p class="small center">――結末は、次の画面で。</p>`;
}
function charConfessed(cid){ const st=charConfessState(cid); return st==="open"||st==="part"; }
// 事件を“実際に解けたか”＝正しい票＋時系列正解＋四人の行動3問以上
function solvedCase(){ return isShinso() && timelineCorrect() && actionScore()>=3; }
function computeEnding(){
  const murder=majority(room.vMurder), culprit=majority(room.vCulprit), chiyo=majority(room.vChiyo), name=majority(room.vName), resp=majority(room.vResp);
  const conf=confessCount();
  // 透が“罪を認めた”か（全告白 open または一部告白 part）
  const toruAdmitted = charConfessState("toru")==="open" || charConfessState("toru")==="part";
  let ed, rank;
  if(murder!=="murder" || culprit!=="toru"){ ed="4"; rank="D"; }        // 事故 or 犯人を確定できない
  else if(name==="seal"){ ed="3"; rank="C"; }                            // 透と当てたが名を封じる＝また一人
  else if(chiyo!=="innocent"){ ed="5"; rank="C"; }                       // 千代の無実に至らず＝表面的な救済
  else if(resp!=="record"){ ed="2"; rank="B"; }                          // 千代は戻ったが責任は透一人へ
  else if(!solvedCase()){ ed="5"; rank="C"; }                            // 票は最良でも、事件の全体像に届いていない
  else if(nameGathered() && toruAdmitted){ ed="1"; rank="S"; }           // 四人が“何を残すか”を自ら選び、透も罪を認めた＝四つの名前
  else { ed="1a"; rank="A"; }                                            // 真相到達（だが誰かは口を閉ざした）
  return {ed,rank,murder,culprit,chiyo,name,resp,conf};
}
function phEnding(){
  const {ed,rank,murder,culprit,chiyo,name,resp,conf}=computeEnding();
  const E=ENDINGS[ed];
  if(ed==="3"||ed==="5") playSfx("fall");
  const mL=murder==="murder"?"殺人":"事故";
  const kL=culprit==="none"?"不明":(CHARS[culprit]?CHARS[culprit].name:"?");
  const cL=chiyo==="innocent"?"無実":(chiyo==="guilty"?"犯人":"?");
  const nL=name==="return"?"戻す":"封じる";
  const rL=resp==="record"?"村側も記録":"一人に集中";
  const rankNote={S:"四人全員が、自らの名を残した。",A:"真相へ到達。だが、誰かは秘密を抱えたまま。",B:"千代は戻った。けれど、責任は一人へ。",C:"何かに、まだ手が届いていない。",D:"事件は、闇の中へ。"}[rank]||"";
  let html=`${pubBadge()}<div class="card" style="text-align:center">
    <div class="rankbadge rank-${rank}">${rank}</div>
    <div class="kv" style="margin-top:.3em">${esc(rankNote)}</div></div>`;
  html+=`<div class="card"><b>結末 ── ${esc(E.name)}</b>
    <p style="margin-top:8px">${nl2br(E.text)}</p></div>`;
  html+=`<div class="card"><div class="kv">${solvedCase()?"真相に到達":"真相は、まだ闇の中"}</div>
    <div class="kv">①巌:<b>${mL}</b> ／ ②犯人:<b>${kL}</b> ／ ③あの子:<b>${cL}</b> ／ ④名前:<b>${nL}</b> ／ ⑤責任:<b>${rL}</b></div>
    <div class="kv">再構成 <b>${timelineCorrect()?"○":"×"}</b> ／ 四人の行動 <b>${actionScore()}/4</b> ／ 告白 <b>${conf}/4</b></div></div>`;
  html+=`<p class="center sub" style="margin:18px 0">――『宵影村・四つの名前』 了</p>`;
  if(isLeader()) html+=`<button class="btn ghost" onclick="resetGame()">また、あの夜へ（部屋をリセット）</button>`;
  return html;
}
async function resetGame(){
  await roomRef.update({
    step:-1, computedStep:-1, sel:null, examine:null, ready:null, disc:null, gaveCard:null, coDone:null,
    guarantee:null, guaranteeDone:null, vMurder:null, vCulprit:null, vChiyo:null, vName:null, vResp:null, voteRedo:null,
    shared:null, discovered:null, dm:null, confess:null, tl:null, tlok:null, da:null,
  });
}

/* ============================================================
   ロビー（役決め＋開始）
   ============================================================ */
async function chooseChar(c){
  if(charTaken(c) && myChar()!==c) return;
  await roomRef.child("players/"+me+"/char").set(c);
}
async function startGame(){
  const ps=players();
  const distinct=new Set(ps.map(p=>p.char).filter(Boolean));
  if(isTest()){
    if(!myChar()) return alert("役をひとつ選んでね（テストモード）");
  }else if(!(ps.length===4 && ps.every(p=>p.char) && distinct.size===4)){
    return alert("4人がそれぞれ別の役を選ぶと始められるよ（名前を「テスト」にすると一人でも開始できます）");
  }
  await roomRef.update({ step:0, computedStep:-1 });
}

/* ============================================================
   手引きシート（常時参照）
   ============================================================ */
let sheetTab="me";
function openSheet(){ closeAllPanels(); $("#sheet").classList.add("open"); syncPaneled(); renderSheet(); }
function closeSheet(){ $("#sheet").classList.remove("open"); syncPaneled(); }
function renderSheet(){
  const tabs=[["me","自分"],["hand","発見"],["roster","面々"],["places","場所"],["story","あらすじ"],["rules","ルール"],["gloss","用語"]];
  $("#tabs").innerHTML=tabs.map(([k,l])=>`<div class="tab ${sheetTab===k?'on':''}" onclick="setTab('${k}')">${l}</div>`).join("");
  const b=$("#sheetBody");
  if(sheetTab==="me"){
    const c=myChar();
    if(!c){ b.innerHTML=`<p class="sub">まだ役が決まっていないよ。</p>`; return; }
    const h=CHARS[c].ho;
    const rv=h.reveal;
    const say=(t)=>`<button class="readbtn" style="float:right" onclick="speak(${JSON.stringify(t).replace(/"/g,'&quot;')})">🔊</button>`;
    b.innerHTML=`<h3>${CHARS[c].name}</h3>
      <p class="sub">${esc(h.prof)}</p>
      <div class="card">${say(h.memory)}<b>あなたの記憶</b><p>${nl2br(h.memory)}</p></div>
      <div class="card mine">${say(h.secret)}<b>秘密</b><p>${nl2br(h.secret)}</p></div>
      ${h.alibi?`<div class="card">${say(h.alibi)}<b>⚖ 疑いを晴らせない理由</b><p>${nl2br(h.alibi)}</p></div>`:""}
      ${rv?`<div class="card mine"><b>🗝 公開すると仲間に伝わる情報（口頭で）</b>
        <p><b>${esc(rv.title)}</b><br>${nl2br(rv.text)}</p>
        <p class="small">${esc(rv.note)}</p></div>`:""}
      <div class="card"><b>本当に怖いこと</b><p>${nl2br(h.fear)}</p></div>
      <div class="card"><b>個人目的</b><ul>${h.goal.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
      <div class="card"><b>知りたいこと</b><ul>${h.want.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
      <div class="card"><b>演技の軸</b><p>${nl2br(h.axis)}</p></div>`;
  }else if(sheetTab==="hand"){
    const disc=(room&&room.disc&&room.disc[me])?Object.values(room.disc[me]):[];
    let out=`<h3>あなたの発見</h3><p class="sub">ここに出ることは、あなたにしか見えていない。話すかどうかは、あなた次第。🔗は「照らし合わせると意味が変わるかも」の合図。</p>`;
    if(disc.length){
      [1,2].forEach(r=>{
        const items=disc.filter(x=>x.round===r);
        if(!items.length) return;
        out+=`<div class="kv" style="margin-top:10px">― ${r===1?"第一":"第二"}探索 ―</div>`;
        items.forEach(x=>{
          const link=x.combo?` <span class="pill">🔗 照合の余地</span>`:"";
          out+=`<div class="card"><b>${esc(x.name||x.id||"手がかり")}</b>${link}<p>${nl2br(x.text)}</p></div>`;
        });
      });
    }else out+=`<p class="sub">まだ何も見つけていない。探索で見つかるよ。</p>`;
    b.innerHTML=out;
  }else if(sheetTab==="roster"){
    const ps=players();
    let out=`<h3>面々</h3><p class="sub">いま誰がどの役か、ぱっと確認。名前をタップすると、その人物の“公開してよい情報”が出るよ。</p>`;
    if(ps.length){
      out+=ps.map(p=>{
        const cn=p.char?CHARS[p.char].name:"（役未定）";
        return `<div class="rchip ${p.connected?'done':''}" style="margin:.2em"><span class="rc"></span><span class="rn">${esc(p.name)}</span><span class="rk">→ ${esc(cn)}</span></div>`;
      }).join("");
    }
    out+=`<hr class="sep"><div class="kv">登場人物（外見・公開してよい情報）</div>`;
    out+=CHAR_ORDER.map(c=>`<div class="card"><b>${CHARS[c].name}</b><p class="sub">${esc(CHARS[c].tagline||"")}</p><p>${esc(CHARS[c].ho.prof)}</p></div>`).join("");
    b.innerHTML=out;
  }else if(sheetTab==="places"){
    b.innerHTML=`<h3>場所の概要</h3><p class="sub">ざっくりした様子だけ。“答え”は書いていないよ。</p>`+
      LOC_ORDER.map(l=>`<div class="card"><b>${LOCS[l].name}</b><p>${esc(LOCS[l].overview||"")}</p></div>`).join("");
  }else if(sheetTab==="story"){
    b.innerHTML=`<h3>あらすじ</h3><button class="readbtn" style="float:right" onclick="speak(${JSON.stringify(SYNOPSIS).replace(/"/g,'&quot;')})">🔊</button><p>${nl2br(SYNOPSIS)}</p>`;
  }else if(sheetTab==="rules"){
    b.innerHTML=`<h3>ルール／遊び方</h3><p>${nl2br(RULES)}</p>`;
  }else if(sheetTab==="gloss"){
    b.innerHTML=`<h3>用語</h3>`+GLOSSARY.map(([t,d])=>`<div class="card"><b>${esc(t)}</b><p class="sub">${nl2br(d)}</p></div>`).join("");
  }
}
function setTab(k){ sheetTab=k; renderSheet(); }

/* ============================================================
   タイマー更新ループ
   ============================================================ */
let lastTimeup={};
setInterval(()=>{
  const el=$("#tmr"); if(!el) return;
  const start=+el.dataset.start, sec=+el.dataset.sec;
  if(!start){ el.textContent="--:--"; return; }
  const left=Math.round(sec-(Date.now()-start)/1000);
  const over=left<0;
  const a=Math.abs(left), mm=String(Math.floor(a/60)).padStart(2,"0"), ss=String(a%60).padStart(2,"0");
  el.textContent=(over?"+":"")+mm+":"+ss;
  el.classList.toggle("over",over);
  if(over && !lastTimeup[start]){ lastTimeup[start]=true; playSfx("timeup"); }
},500);
